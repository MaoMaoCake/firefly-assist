server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached permanently.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate app shell, manifest and service worker on each visit.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Missing scripts must not receive the SPA's HTML fallback.
    location ~* \.(js|css|json|webmanifest|png|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
