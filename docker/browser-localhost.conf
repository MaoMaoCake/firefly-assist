# These listeners exist only inside the browser container's network namespace.
server {
    listen 127.0.0.1:8080;
    location / {
        proxy_pass http://firefly-assist:80;
        proxy_set_header Host $http_host;
    }
}
server {
    listen 127.0.0.1:8081;
    location / {
        proxy_pass http://firefly:8080;
        proxy_set_header Host $http_host;
    }
}
